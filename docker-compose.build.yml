# 중앙화된 빌드를 위한 Docker Compose 설정
version: '3.8'

services:
  # 재현 가능한 빌드 서비스
  build-artifacts:
    build:
      context: .
      dockerfile: Dockerfile.build
      args:
        BUILD_ID: ${BUILD_ID:-dev}
    volumes:
      # 빌드 결과를 호스트로 출력
      - ./build-output:/artifacts
    environment:
      - NODE_ENV=production
      - NUXT_BUILD_ID=${BUILD_ID:-dev}
    networks:
      - build-network

  # 빌드 결과 검증 서비스
  verify-build:
    image: node:20-alpine
    depends_on:
      - build-artifacts
    volumes:
      - ./build-output:/build:ro
      - ./scripts:/scripts:ro
    working_dir: /scripts
    command: sh -c "node verify-build.js /build"
    networks:
      - build-network

  # 다중 서버 배포 시뮬레이터 (테스트용)
  deploy-simulator:
    image: alpine:latest
    depends_on:
      - verify-build
    volumes:
      - ./build-output:/build:ro
      - ./scripts:/scripts:ro
    working_dir: /scripts
    command: sh -c "./simulate-deploy.sh /build"
    networks:
      - build-network

networks:
  build-network:
    driver: bridge